<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReckoOne Conversion</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
        }
        .btn {
            display: inline-block;
            padding: 10px 20px;
            font-size: 16px;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            border-radius: 5px;
            background-color: #28a745;
            color: #fff;
            border: none;
        }
        #checkbox {
            margin-bottom: 20px;
        }

        hr {
            border: 0;
            height: 1px;
            background: #ccc;
            margin: 20px 0;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .infographic-img {
            max-width: 100%;
            height: auto;
        }

        .card {
            width: 100%;
            max-width: 820px;
            text-align: center;
            padding: 20px;
            border-radius: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            text-align: left;
            font-weight: bold;
        }

        .form-control {
            border: none;
            border-radius: 0;
            border-bottom: 1px solid #ccc;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="container mt-5">

            
            {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
            {% for category, message in messages %}
            <div class="alert alert-danger" role="alert">
                {{ message }}
            </div>
            {% endfor %}
            {% endif %}
            {% endwith %}
            <img class="infographic-img mb-4" src="/static/assets/img/mmc_logo.png" alt="Infographic"
                style="width: 70px;">
            <div class="alert alert-success" role="alert">
                Great! You have successfully connected to Reckonone
            </div>
            <div class="card">

                    <div class="card-header">
                        <h1 class="text"><b>Start Conversion From SAGEONE TO RECKONONE</b></h1>
                        <br>
                    </div>
        
                        <button class="btn btn-primary" id="start_conversion" onclick="startconversion('{{ job_id }}')">Start Conversion</button>
                    </div>
       
              
             
            </div>
        </div>

        <!-- jQuery and Bootstrap JS CDN links -->
        <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"
            integrity="sha512-pumBsjNRGGqkPzKHndZMaAG+bir374sORyzM3uulLV14lN5LyykqNk8eEeUlUkB3U0M4FApyaHraT65ihJhDpQ=="
            crossorigin="anonymous" referrerpolicy="no-referrer"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.4/js/select2.min.js"></script>
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
        <script>

        function startconversion(jobId) {
                redirecttonextpage(jobId)
                $.ajax({
                    url: '/startJobByID/' + jobId,
                    type: 'POST',
                    success: function(response) {
                        console.log(jobId)
                } 
                });
            }
                function redirecttonextpage(jobId){
                    window.location.href = "/conversion_underway/" + jobId;
                }
         
        </script>
</body>

</html>
