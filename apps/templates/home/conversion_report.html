<!DOCTYPE html>
<html>

<head>
    <title>Function Data Report</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        h1 {
            text-align: center;
            color: #333;
        }

        table {
            margin: 0 auto;
            border-collapse: collapse;
            width: 80%;
            background-color: #fff;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-shadow: 0px 10px 10px #130202;
        }

        th {
            text-align: center;
            font-size: 18px;
            background-color: #333;
            color: #fff;
            padding: 10px;
        }

        td {
            text-align: center;
            font-size: 16px;
            border-bottom: 1px solid #ddd;
        }

        tr:nth-child(even) {
            background-color: #f2f2f2;
        }

        tr:hover {
            background-color: #ccc;
        }

        .table-wrapper {
            overflow-x: auto;
        }

        .progress-bar-container {
            height: 20px;
            background-color: #ccc;
            border-radius: 5px;
        }

        .progress-bar {
            height: 100%;
            width: 0;
            /* You will set the width dynamically */
            background-color: #333;
            border-radius: 5px;
        }
    </style>
</head>

<body>
    <h1>Reports for the Data Conversion: XERO to QBO</h1>
    <br />
    <div class="table-wrapper">
        <table>
            <tr>
                <th>Function Name</th>
                <th>Progress</th>
            </tr>

            <tr>
                <td>Chart of Account</td>
                <td>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: 70%"></div>
                    </div>
                </td>
            </tr>
            <tr>
                <td>Supplier</td>
                <td>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: 70%"></div>
                    </div>
                </td>
            </tr>
            <tr>
                <td>Customer</td>
                <td>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: 79%"></div>
                    </div>
                </td>
            </tr>
            <tr>
                <td>Item</td>
                <td>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: 80%"></div>
                    </div>
                </td>
            </tr>
            <tr>
                <td>Spend Money</td>
                <td>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: 90%"></div>
                    </div>
                </td>
            </tr>
            <tr>
                <td>Receive Money</td>
                <td>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: 80%"></div>
                    </div>
                </td>
            </tr>
            <tr>
                <td>Bank Transfer</td>
                <td>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: 35%"></div>
                    </div>
                </td>
            </tr>
            <tr>
                <td>Invoice</td>
                <td>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: 100%"></div>
                    </div>
                </td>
            </tr>
            <tr>
                <td>Bill</td>
                <td>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: 65%"></div>
                    </div>
                </td>
            </tr>
            <tr>
                <td>Journal</td>
                <td>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: 60%"></div>
                    </div>
                </td>
            </tr>
            <tr>
                <td>Invoice Payment</td>
                <td>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: 70%"></div>
                    </div>
                </td>
            </tr>
            <tr>
                <td>Bill Payment</td>
                <td>
                    <div class="progress-bar-container">
                        <div class="progress-bar" style="width: 40%"></div>
                    </div>
                </td>
            </tr>


            <!-- Repeat the above row for each function -->
        </table>
    </div>
</body>

</html>
