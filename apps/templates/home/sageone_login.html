<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f8f9fa;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            background-color: #fff;
            padding: 35px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            width: 400px;
            max-width: 90%;
            text-align: center;
        }

        .container img {
            margin-bottom: 20px;
        }

        .container h2 {
            margin-bottom: 20px;
            color: #333;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }

        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #007bff;
        }

        .form-group button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .form-group button:hover {
            background-color: #0056b3;
        }

        .alert-danger {
        color: red; /* Change "blue" to your desired color */
            /* You can also specify other properties like background-color, border-color, etc. */
        }

    </style>
</head>



<body>
    <div class="container">


{% with messages = get_flashed_messages(with_categories=true) %}
{% if messages %}
    {% for category, message in messages %}
    <div class="alert alert-danger" role="alert">
        {{ message }}
    </div>
    {% endfor %}
{% endif %}
{% endwith %}


        
        <img src="/static/assets/img/sageone.png" alt="SageOne Logo" width="350" height="90">
        <h2>Login</h2>
        <form enctype="multipart/form-data" method="post">
            <div class="form-group">


                <input type="text" id="sageusername" name="sageusername" required>
                
            </div>
            <div class="form-group">

                    <input type="text" id="sagepassword" name="sagepassword" required>
                
            </div>
            <div class="form-group">
                <button class="btn btn-success mb-3"><i class="fas fa-sign-in-alt"></i> Login</button>
            </div>
        </form>
    </div>
</body>

</html>
