<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Start Conversion</title>
    <link href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f5f5f5;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .infographic-img {
            max-width: 100%;
            height: auto;
        }

        .card {
            width: 100%;
            max-width: 820px;
            text-align: center;
            padding: 20px;
            border-radius: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            text-align: left;
            font-weight: bold;
        }

        .form-control {
            border: none;
            border-radius: 0;
            border-bottom: 1px solid #ccc;
        }
    </style>
</head>

<body>
    <div class="container">
        <img class="infographic-img mb-4" src="/static/assets/img/mmc_logo.png" alt="Infographic" style="width: 100px; height: 100px;">
   
        <div class="card">
            <div class="card-header">
                <h1 class="text"><b>Start Conversion From Sage One to Reckon</b></h1>
                <br>
            </div>
            <button class="btn btn-primary" id="start_conversion" onclick="startConversion('{{ job_id }}')">Start Conversion</button>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.4/jquery.min.js"
        integrity="sha512-pumBsjNRGGqkPzKHndZMaAG+bir374sORyzM3uulLV14lN5LyykqNk8eEeUlUkB3U0M4FApyaHraT65ihJhDpQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.4/js/select2.min.js"></script>
    <script>
        function startConversion(jobId) {
            redirecttonextpage(jobId)
            $.ajax({
                url: '/startJobByIDSelf/' + jobId,
                type: 'POST',
                success: function(response) {
                    console.log(jobId);

                    
                },
                error: function(error) {
                    console.error('Error:', error);
                }
            });
        }

        function redirecttonextpage(jobId){
            window.location.href = "/reporttasks/" + jobId;
        }
    </script>
</body>

</html>
