{% extends "layouts/base.html" %}

{% block title %} UI Forms {% endblock %}

<!-- Specific Page CSS goes HERE  -->
{% block stylesheets %}{% endblock stylesheets %}

{% block content %}
		<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
			<h4 class="page-title">LOGINd ID'S</h4>
			<nav aria-label="breadcrumb">
				<ol class="breadcrumb">
					<li class="breadcrumb-item"><a href="#">Home</a></li>
					<li class="breadcrumb-item active" aria-current="page">Add New ID</li>
				</ol>
			</nav>
		</div>
<div class="row">
	<div class="col-md-12" style="height: 100vh;">
		<div class="card">
			<div class="card-header" style="background-color:  #6495ED;">
				<div class="card-title" style="color: white;">Create Id</div>
			</div>
			<form action="" method="post">
				<div class="card-body">
					<div class="row">
						<div class="col-md-6 col-lg-4">
							<div class="form-group mt-2">
								<label for="name">Email</label>
								<input type="text" class="form-control" id="name" name="name"
									placeholder="Enter Email Id">
							</div>

							<div class="form-group mt-2">
								<label for="name">client_id</label>
								<input type="text" class="form-control" id="client_id" name="client_id"
									placeholder="Enter Client ID">
							</div>

							<div class="form-group mt-2">
								<label for="name">client_secret</label>
								<input type="text" class="form-control" id="client_secret" name="client_secret"
									placeholder="Enter Client Secret ">
							</div>
						</div>
					</div>
				</div>
				<div class="card-action">
					<button class="btn btn-success ms-3 mb-3" type="submit">Submit</button>
					<!-- <button class="btn btn-danger">Cancel</button> -->
				</div>
			</form>
		</div>
	</div>
</div>

{% endblock content %}
