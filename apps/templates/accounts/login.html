<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign In - MMC</title>
  <link href="/static/assets/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background: linear-gradient(to right, #6a11cb, #2575fc);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
    }

    .form-signin {
      background: #fff;
      padding: 40px 30px;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .form-signin img {
      width: 70px;
      margin-bottom: 20px;
    }

    .form-signin h4 {
      margin-bottom: 25px;
      font-weight: 600;
      color: #333;
    }

    .form-floating {
      margin-bottom: 20px;
    }

    .form-control {
      border-radius: 10px;
    }

    .btn-primary {
      background-color: #2575fc;
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-weight: 500;
      transition: background-color 0.3s ease;
    }

    .btn-primary:hover {
      background-color: #1a5de2;
    }

    label {
      color: #666;
    }
  </style>
</head>
<body>

  <main class="form-signin">
    <form method="post" action="">
      {{ form.hidden_tag() }}
      <img src="/static/assets/img/mmc_logo.png" alt="MMC Logo">
      <h4>Welcome to MMC</h4>

      <div class="form-floating">
        {{ form.username(placeholder="Username", class="form-control") }}
        <label>Username or Email</label>
      </div>

      <div class="form-floating">
        {{ form.password(placeholder="Password", class="form-control") }}
        <label>Password</label>
      </div>

      <button type="submit" name="login" class="w-100 btn btn-primary">Sign In</button>
    </form>
  </main>

</body>
</html>
